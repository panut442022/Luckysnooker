<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎱 Lucky Snooker Club</title>

<style>
:root{
  --green:#1a6b3c;
  --green-light:#2d8a52;
  --green-dark:#0f4a28;
  --gold:#c9a227;
  --bg:#08130c;
  --card:#102219;
  --surface:#183224;
  --text:#e8f5ed;
  --muted:#8db19b;
  --border:rgba(45,138,82,.3);
  --red:#e24b4a;
  --amber:#ef9f27;
  --radius:14px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,'Sarabun',sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input{
  font-family:inherit;
}

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:340px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
}

.logo{
  text-align:center;
  font-size:54px;
}

.title{
  text-align:center;
  font-size:24px;
  font-weight:700;
  color:var(--gold);
  margin-bottom:24px;
}

.form-group{
  margin-bottom:14px;
}

.label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}

.input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px;
  color:var(--text);
  outline:none;
}

.btn{
  width:100%;
  border:none;
  border-radius:10px;
  padding:14px;
  cursor:pointer;
  font-weight:700;
  background:var(--green);
  color:white;
}

.btn-danger{
  background:var(--red);
}

.nav{
  padding:14px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.nav-title{
  color:var(--gold);
  font-weight:700;
}

.logout{
  background:none;
  border:none;
  color:var(--red);
  cursor:pointer;
}

.page{
  padding:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.table{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  cursor:pointer;
}

.table.active{
  border-color:var(--amber);
}

.table-name{
  font-weight:700;
  margin-bottom:8px;
}

.timer{
  font-size:22px;
  color:var(--amber);
  font-weight:700;
}

.amount{
  margin-top:6px;
  color:var(--gold);
}

.empty{
  color:var(--muted);
  font-size:13px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:flex-end;
}

.modal{
  width:100%;
  background:var(--card);
  border-radius:22px 22px 0 0;
  padding:18px;
  max-height:90vh;
  overflow:auto;
}

.modal-title{
  font-size:18px;
  font-weight:700;
  color:var(--gold);
  margin-bottom:18px;
}

.close{
  float:right;
  border:none;
  background:none;
  color:#999;
  font-size:22px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.order-box{
  background:var(--surface);
  border-radius:12px;
  padding:12px;
  margin-top:14px;
}

.order-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}

.remove{
  background:none;
  border:none;
  color:var(--red);
  margin-left:8px;
}

.tabs{
  display:flex;
  background:var(--card);
  border-top:1px solid var(--border);
}

.tab{
  flex:1;
  border:none;
  background:none;
  padding:12px;
  color:var(--muted);
}

.tab.active{
  color:var(--green-light);
}

.toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 18px;
  border-radius:999px;
  display:none;
}

.sync{
  background:rgba(45,138,82,.15);
  border:1px solid var(--border);
  padding:10px;
  border-radius:12px;
  margin-bottom:14px;
  font-size:13px;
  color:var(--muted);
}

.history{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div id="app"></div>

<div class="toast" id="toast"></div>

<script>

// ================================
// GOOGLE APPS SCRIPT URL
// ================================

var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxJ5oKn4T85zzJPPkiF-Y81TqS90pqGJ5D0vsiBORjehf9guZywH_h4W93LigMd-48cUg/exec";

// ================================
// DATA
// ================================

var D = {

  user:null,
  page:'tables',
  modal:null,
  timer:null,

  users:[
    {
      username:'admin',
      password:'1234',
      name:'Admin'
    }
  ],

  rate:120,

  tables:[
    {
      id:1,
      name:'โต๊ะ 1',
      status:'vacant',
      start:null,
      manualCharges:[]
    },
    {
      id:2,
      name:'โต๊ะ 2',
      status:'vacant',
      start:null,
      manualCharges:[]
    },
    {
      id:3,
      name:'โต๊ะ 3',
      status:'vacant',
      start:null,
      manualCharges:[]
    },
    {
      id:4,
      name:'โต๊ะ 4',
      status:'vacant',
      start:null,
      manualCharges:[]
    }
  ],

  history:[]
};

// ================================
// HELPERS
// ================================

function pad(n){
  return n < 10 ? '0'+n : n;
}

function elapsed(start){

  if(!start) return 0;

  return Math.floor((Date.now()-start)/1000);
}

function fmt(sec){

  var h=Math.floor(sec/3600);
  var m=Math.floor((sec%3600)/60);
  var s=sec%60;

  return pad(h)+':'+pad(m)+':'+pad(s);
}

function calcTable(start){

  return Math.ceil(elapsed(start)/3600 * D.rate);
}

function toast(msg){

  var t=document.getElementById('toast');

  t.innerText=msg;

  t.style.display='block';

  setTimeout(function(){

    t.style.display='none';

  },2500);
}

// ================================
// LOCAL SAVE
// ================================

function saveLocal(){

  localStorage.setItem(
    'snooker_data',
    JSON.stringify(D)
  );
}

function loadLocal(){

  var data=localStorage.getItem('snooker_data');

  if(data){

    try{

      var parsed=JSON.parse(data);

      D.rate=parsed.rate || 120;
      D.tables=parsed.tables || D.tables;
      D.history=parsed.history || [];

    }catch(e){}
  }
}

// ================================
// GOOGLE SHEETS SYNC
// ================================

function syncCloud(){

  if(!SCRIPT_URL || SCRIPT_URL.includes("PUT_YOUR")) return;

  fetch(SCRIPT_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{
      'Content-Type':'text/plain'
    },
    body:JSON.stringify({
      tables:D.tables,
      history:D.history,
      rate:D.rate
    })
  });
}

// ================================
// RENDER
// ================================

function render(){

  var app=document.getElementById('app');

  if(!D.user){

    app.innerHTML=loginHTML();

    bindLogin();

    return;
  }

  app.innerHTML=appHTML();

  bindApp();

  startTimer();
}

// ================================
// LOGIN
// ================================

function loginHTML(){

  return `
  <div class="login">

    <div class="login-card">

      <div class="logo">🎱</div>

      <div class="title">
        LUCKY SNOOKER
      </div>

      <div class="form-group">

        <label class="label">
          Username
        </label>

        <input class="input" id="user">

      </div>

      <div class="form-group">

        <label class="label">
          Password
        </label>

        <input type="password" class="input" id="pass">

      </div>

      <button class="btn" id="loginBtn">
        เข้าสู่ระบบ
      </button>

    </div>

  </div>
  `;
}

function bindLogin(){

  document.getElementById('loginBtn').onclick=function(){

    var u=document.getElementById('user').value;
    var p=document.getElementById('pass').value;

    var found=D.users.find(function(x){

      return x.username===u &&
             x.password===p;
    });

    if(found){

      D.user=found;

      render();

    }else{

      toast('เข้าสู่ระบบไม่สำเร็จ');
    }
  };
}

// ================================
// APP
// ================================

function appHTML(){

  return `
  <div class="nav">

    <div class="nav-title">
      🎱 LUCKY SNOOKER
    </div>

    <button class="logout" id="logoutBtn">
      ออกจากระบบ
    </button>

  </div>

  <div class="page">

    ${pageHTML()}

  </div>

  ${D.modal ? modalHTML() : ''}

  <div class="tabs">

    <button
      class="tab ${D.page==='tables'?'active':''}"
      data-page="tables"
    >
      🎱 โต๊ะ
    </button>

    <button
      class="tab ${D.page==='history'?'active':''}"
      data-page="history"
    >
      📋 ประวัติ
    </button>

    <button
      class="tab ${D.page==='settings'?'active':''}"
      data-page="settings"
    >
      ⚙️ ตั้งค่า
    </button>

  </div>
  `;
}

function pageHTML(){

  if(D.page==='tables') return tablesPage();
  if(D.page==='history') return historyPage();
  if(D.page==='settings') return settingsPage();

  return '';
}

// ================================
// TABLE PAGE
// ================================

function tablesPage(){

  return `
  <div class="sync">
    ☁️ Auto Save พร้อมใช้งาน
  </div>

  <div class="grid">

    ${D.tables.map(function(t){

      return `
      <div
        class="table ${t.status}"
        data-table="${t.id}"
      >

        <div class="table-name">
          ${t.name}
        </div>

        ${
          t.status==='active'

          ?

          `
          <div
            class="timer"
            id="timer-${t.id}"
          >
            ${fmt(elapsed(t.start))}
          </div>

          <div
            class="amount"
            id="amount-${t.id}"
          >
            ฿${calcTable(t.start)}
          </div>
          `

          :

          `
          <div class="empty">
            ว่าง
          </div>
          `
        }

      </div>
      `;
    }).join('')}

  </div>
  `;
}

// ================================
// HISTORY PAGE
// ================================

function historyPage(){

  if(!D.history.length){

    return `<div class="empty">ยังไม่มีประวัติ</div>`;
  }

  return D.history.slice().reverse().map(function(h){

    return `
    <div class="history">

      <div>
        <b>${h.table}</b>
      </div>

      <div style="margin-top:6px">
        ${h.date}
      </div>

      <div style="margin-top:6px;color:var(--gold)">
        ฿${h.total}
      </div>

    </div>
    `;
  }).join('');
}

// ================================
// SETTINGS PAGE
// ================================

function settingsPage(){

  return `
  <div class="history">

    <div class="form-group">

      <label class="label">
        ค่าโต๊ะต่อชั่วโมง
      </label>

      <input
        type="number"
        class="input"
        id="rateInput"
        value="${D.rate}"
      >

    </div>

    <button class="btn" id="saveRate">
      บันทึก
    </button>

  </div>
  `;
}

// ================================
// MODAL
// ================================

function modalHTML(){

  if(D.modal.type==='table'){

    return tableModal(D.modal.id);
  }

  if(D.modal.type==='checkout'){

    return checkoutModal(D.modal.id);
  }
}

function wrap(title,body){

  return `
  <div class="modal-bg" id="bg">

    <div class="modal">

      <button class="close" id="close">
        ✕
      </button>

      <div class="modal-title">
        ${title}
      </div>

      ${body}

    </div>

  </div>
  `;
}

// ================================
// TABLE MODAL
// ================================

function tableModal(id){

  var t=D.tables.find(function(x){
    return x.id===id;
  });

  var extra=(t.manualCharges || []).reduce(function(s,o){

    return s+o.amount;

  },0);

  if(t.status==='vacant'){

    return wrap(
      t.name,

      `
      <button class="btn" id="openTable">
        ▶ เปิดโต๊ะ
      </button>
      `
    );
  }

  return wrap(

    t.name,

    `
    <div class="row">

      <span>เวลา</span>

      <span id="modalTimer">
        ${fmt(elapsed(t.start))}
      </span>

    </div>

    <div class="row">

      <span>ค่าโต๊ะ</span>

      <span id="modalAmount">
        ฿${calcTable(t.start)}
      </span>

    </div>

    <div style="margin-top:16px;font-weight:700">
      💵 เพิ่มค่าใช้จ่าย
    </div>

    <div class="form-group" style="margin-top:10px">

      <input
        class="input"
        id="chargeName"
        placeholder="ชื่อรายการ"
      >

    </div>

    <div class="form-group">

      <input
        type="number"
        class="input"
        id="chargeAmount"
        placeholder="จำนวนเงิน"
      >

    </div>

    <button class="btn" id="addCharge">
      + เพิ่มรายการ
    </button>

    ${
      t.manualCharges.length

      ?

      `
      <div class="order-box">

        ${t.manualCharges.map(function(c,i){

          return `
          <div class="order-row">

            <span>
              ${c.name}
            </span>

            <span>

              ฿${c.amount}

              <button
                class="remove"
                data-remove="${i}"
              >
                ✕
              </button>

            </span>

          </div>
          `;
        }).join('')}

        <div
          class="order-row"
          style="border-top:1px solid var(--border);padding-top:10px;font-weight:700"
        >

          <span>รวม</span>

          <span>฿${extra}</span>

        </div>

      </div>
      `

      :

      ''
    }

    <button
      class="btn btn-danger"
      id="checkout"
      style="margin-top:16px"
    >
      ปิดโต๊ะ / คิดเงิน
    </button>
    `
  );
}

// ================================
// CHECKOUT MODAL
// ================================

function checkoutModal(id){

  var t=D.tables.find(function(x){
    return x.id===id;
  });

  var tableAmt=calcTable(t.start);

  var extra=(t.manualCharges || []).reduce(function(s,o){

    return s+o.amount;

  },0);

  var total=tableAmt+extra;

  return wrap(

    'ชำระเงิน',

    `
    <div class="order-box">

      <div class="order-row">

        <span>ค่าโต๊ะ</span>
        <span>฿${tableAmt}</span>

      </div>

      <div class="order-row">

        <span>ค่าใช้จ่ายเพิ่ม</span>
        <span>฿${extra}</span>

      </div>

      <div
        class="order-row"
        style="font-weight:700;border-top:1px solid var(--border);padding-top:10px"
      >

        <span>รวมทั้งหมด</span>
        <span>฿${total}</span>

      </div>

    </div>

    <button
      class="btn"
      id="confirmCheckout"
    >
      ยืนยันรับเงิน
    </button>
    `
  );
}

// ================================
// EVENTS
// ================================

function bindApp(){

  document.getElementById('logoutBtn').onclick=function(){

    D.user=null;

    render();
  };

  document.querySelectorAll('[data-page]').forEach(function(el){

    el.onclick=function(){

      D.page=el.dataset.page;

      render();
    };
  });

  document.querySelectorAll('[data-table]').forEach(function(el){

    el.onclick=function(){

      D.modal={
        type:'table',
        id:parseInt(el.dataset.table)
      };

      render();

      bindModal();
    };
  });

  var save=document.getElementById('saveRate');

  if(save){

    save.onclick=function(){

      D.rate=parseInt(
        document.getElementById('rateInput').value
      ) || 120;

      saveLocal();

      syncCloud();

      toast('บันทึกแล้ว');

      render();
    };
  }
}

// ================================
// MODAL EVENTS
// ================================

function bindModal(){

  document.getElementById('close').onclick=function(){

    D.modal=null;

    render();
  };

  document.getElementById('bg').onclick=function(e){

    if(e.target.id==='bg'){

      D.modal=null;

      render();
    }
  };

  var open=document.getElementById('openTable');

  if(open){

    open.onclick=function(){

      var t=D.tables.find(function(x){

        return x.id===D.modal.id;
      });

      t.status='active';

      t.start=Date.now();

      t.manualCharges=[];

      saveLocal();

      syncCloud();

      D.modal=null;

      render();

      startTimer();
    };
  }

  var add=document.getElementById('addCharge');

  if(add){

    add.onclick=function(){

      var name=document.getElementById('chargeName').value.trim();

      var amount=parseInt(
        document.getElementById('chargeAmount').value
      );

      if(!name || !amount){

        return;
      }

      var t=D.tables.find(function(x){

        return x.id===D.modal.id;
      });

      t.manualCharges.push({
        name:name,
        amount:amount
      });

      saveLocal();

      syncCloud();

      render();

      bindModal();
    };
  }

  document.querySelectorAll('[data-remove]').forEach(function(el){

    el.onclick=function(){

      var t=D.tables.find(function(x){

        return x.id===D.modal.id;
      });

      t.manualCharges.splice(
        parseInt(el.dataset.remove),
        1
      );

      saveLocal();

      syncCloud();

      render();

      bindModal();
    };
  });

  var checkout=document.getElementById('checkout');

  if(checkout){

    checkout.onclick=function(){

      D.modal={
        type:'checkout',
        id:D.modal.id
      };

      render();

      bindModal();
    };
  }

  var confirm=document.getElementById('confirmCheckout');

  if(confirm){

    confirm.onclick=function(){

      var t=D.tables.find(function(x){

        return x.id===D.modal.id;
      });

      var tableAmt=calcTable(t.start);

      var extra=(t.manualCharges || []).reduce(function(s,o){

        return s+o.amount;

      },0);

      var total=tableAmt+extra;

      var now=new Date();

      D.history.push({

        table:t.name,

        total:total,

        date:
          pad(now.getDate())+'/'+
          pad(now.getMonth()+1)+'/'+
          now.getFullYear()+' '+
          pad(now.getHours())+':'+
          pad(now.getMinutes())
      });

      t.status='vacant';

      t.start=null;

      t.manualCharges=[];

      saveLocal();

      syncCloud();

      D.modal=null;

      toast('รับเงิน ฿'+total+' เรียบร้อย');

      render();
    };
  }
}

// ================================
// TIMER
// ================================

function startTimer(){

  if(D.timer){

    clearInterval(D.timer);
  }

  D.timer=setInterval(function(){

    D.tables.forEach(function(t){

      if(t.status!=='active') return;

      var timer=document.getElementById(
        'timer-'+t.id
      );

      var amount=document.getElementById(
        'amount-'+t.id
      );

      if(timer){

        timer.innerText=fmt(elapsed(t.start));
      }

      if(amount){

        amount.innerText='฿'+calcTable(t.start);
      }

      if(
        D.modal &&
        D.modal.type==='table' &&
        D.modal.id===t.id
      ){

        var mt=document.getElementById('modalTimer');

        var ma=document.getElementById('modalAmount');

        if(mt){

          mt.innerText=fmt(elapsed(t.start));
        }

        if(ma){

          ma.innerText='฿'+calcTable(t.start);
        }
      }

    });

  },1000);
}

// ================================
// START
// ================================

loadLocal();

render();

</script>

</body>
</html>
